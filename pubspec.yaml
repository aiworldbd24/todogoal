name: todogoal
description: Futuristic cross-platform to-do application with glassmorphism UI.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  http: ^1.1.0
  intl: ^0.18.0
  firebase_core: ^2.10.0
  firebase_auth: ^4.6.0
  firebase_messaging: ^14.5.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.1.10
  uuid: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
